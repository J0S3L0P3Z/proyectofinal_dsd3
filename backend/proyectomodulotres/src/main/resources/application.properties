# Configuracion general
spring.application.name=PROYECTOMODULOTRES
server.port=8080

# Direcciones del front que pueden llamar al back (CORS), separadas por comas.
# app.cors.origenes=http://localhost:4200,https://link-del-front-desplegado
app.cors.origenes=http://localhost:4200,https://scrappindoo.netlify.app

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Conexion MySQL
spring.datasource.url=jdbc:mysql:/
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion del pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Configuracion JWT
jwt.secret=
jwt.expiration=

# Administrador inicial
app.admin.correo=admin@gmail.com
app.admin.contrasena=admin2026#

# Configuracion AES-256-GCM
aes.secret-key=

# Configuracion Swagger
springdoc.swagger-ui.path=/
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.syntaxHighlight.theme=markdown
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.supportedSubmitMethods=get,post,put,delete
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.html-escaping.enabled=false

# Configuracion de logs
logging.level.root=INFO
logging.level.co.edu.unbosque.proyectomodulotres=DEBUG

# Carpeta donde se almacenan los reportes PDF
app.reportes.ruta=archivos/pdf

# Configuracion de las IA

app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
app.ai.gemini.api-key=

app.ai.groq.base-url=https://api.groq.com/openai/v1
app.ai.groq.api-key=

app.ai.cloudflare.base-url=https://api.cloudflare.com/client/v4/accounts
app.ai.cloudflare.account-id=
app.ai.cloudflare.api-token=

# Modelo 1 - Gemini - Analisis general
app.ai.model-1=gemini-3.8-flash

# Modelo 2 - Groq - Analisis general
app.ai.model-2=openai/gpt-oss-120b

# Modelo 3 - Cloudflare - Analisis general
app.ai.model-3=@cf/google/gemma-4-26b-a4b-it

# Modelo 4 - Gemini - Identificacion de tecnologias
app.ai.model-4=gemini-3.8-flash

# Modelo 5 - Gemini - Identificacion de nombres
app.ai.model-5=gemini-3.8-flash

app.ai.timeout-seconds=120
app.ai.max-retries=3

# Configuracion de correo electronico Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=scrapingdooueb@gmail.com
spring.mail.password=

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Correo remitente
correo.remitente=scrapingdooueb@gmail.com