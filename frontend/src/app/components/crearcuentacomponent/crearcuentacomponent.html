<section class="seccion-hero">

  <img
    src="/imagenes/fondoInicio.jpeg"
    class="imagen-fondo-hero"
    alt="Fondo de la sección principal"
  >

  <main class="container my-auto py-5 position-relative z-1">
    <div class="row gy-5 align-items-center justify-content-center">


      <!-- columna del formato -->
      <div class="col-md-8 col-lg-6 col-xl-5 mx-auto">

        <div class="card tarjeta-login border-secondary border-opacity-25 rounded-4 p-4 p-sm-5">

          <div class="card-body p-0">
            <h3 class="text-primary h4 fw-bold mb-1">Bienvenido de nuevo</h3>
            <p class="text-secondary small mb-4">Ingresa tus datos para que tengas una cuenta con nosotros.</p>

            <form>


              <!-- Usuario -->
              <div class="input-group mb-3">
                <label for="email" class="form-label text-primary h6 fw-bold mb-1">Nombre de Usuario:</label>
                <div class="input-group grupo-entrada-oscuro">

              <span class="input-group-text bg-transparent border-end-0 text-secondary" id="basic-addon1">
                <i class="fa-solid fa-user"></i>
              </span>
                  <input type="text" class="form-control bg-transparent  text-white" id="email"
                         placeholder="Eje: xtuliox.x" aria-label="Eje: xtuliox.x" required>
                </div>
              </div>

              <!-- Correo electronico -->
              <div class="input-group mb-3">
                <label for="email" class="form-label text-primary h6 fw-bold mb-1">Correo electrónico</label>
                <div class="input-group grupo-entrada-oscuro">

              <span class="input-group-text bg-transparent  text-secondary" id="basic-addon1">

                <i class="fa-regular fa-envelope"></i>
              </span>
                  <input type="email" class="form-control bg-transparent  text-white" id="email"
                         placeholder="Eje: julioesteban@correo" aria-label="Eje:julioesteban@correo" required>
                </div>
              </div>

              <!-- Fecha De Nacimiento Estilizada -->
              <div class="mb-3">
                <label for="datepicker2" class="form-label text-primary h6 fw-bold mb-1">Fecha De Nacimiento</label>
                <div class="input-group grupo-entrada-oscuro">
                     <span class="input-group-text bg-transparent text-secondary" id="basic-addon1">
                           <i class="fa-solid fa-calendar"></i>
                      </span>
                        <input type="text" class="form-control bg-transparent text-white  shadow-none" id="datepicker2"
                         data-bs-toggle="datepicker" autocomplete="off" placeholder="DD / MM / AAAA" required>
                </div>
              </div>


              <!-- Contraseña con Medidor de Fuerza -->
              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="password" class="form-label text-primary h6 fw-bold mb-1">Contraseña</label>

                </div>

                <div class="input-group grupo-entrada-oscuro">
                     <span class="input-group-text bg-transparent  text-secondary">
                      <i class="fa-solid fa-lock"></i>
                  </span>

                  <!-- tiempo real con la función -->
                  <input type="password" class="form-control bg-transparent text-white shadow-none"
                         id="password" placeholder="••••••••" (input)="verificarFuerza($event)" required>
                </div>

                <!-- fuerza de la contraseña -->
                <div class="strength mt-2" data-bs-strength>
                  <div class="strength-segment" [class.active]="fuerza >= 1"></div>
                  <div class="strength-segment" [class.active]="fuerza >= 2"></div>
                  <div class="strength-segment" [class.active]="fuerza >= 3"></div>
                  <div class="strength-segment" [class.active]="fuerza >= 4"></div>
                </div>

                <span class="strength-text text-secondary small mt-1 d-block">{{ textoFuerza }}</span>
              </div>


              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="password" class="form-label text-primary h6 fw-bold mb-1">Confirmar contraseña</label>
                </div>
                <div class="input-group grupo-entrada-oscuro">
                      <span class="input-group-text bg-transparent border-end-0 text-secondary" id="basic-addon2">
                        <i class="fa-solid fa-lock"></i>
                       </span>
                  <input type="password" class="form-control bg-transparent text-white" id="confirmar-password"
                         placeholder="••••••••" required>
                </div>
              </div>
              <br>
              <!-- Botón de inicio de Sesión -->

              <button type="submit"
                      class="btn btn-primary w-100 py-2.5 fw-semibold d-flex align-items-center justify-content-center gap-2 mb-4">
                Iniciar sesión
                <i class="bi bi-arrow-right"></i>
              </button>

            </form>
          </div>
        </div>
      </div>

    </div>
  </main>
</section>
